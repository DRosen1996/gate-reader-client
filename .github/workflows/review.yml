name: Review ledger checks
on:
  push:
    branches: [review-ledger-v1, review-readonly-bridge, review-chat-sync]
  pull_request:
    branches: [main, review-ledger-v1, review-readonly-bridge]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q review tools reader_bridge gate_reader tests
      - run: node --check review/static/app.js
